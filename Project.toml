version = "2.14.0"
# [[[end]]]
authors = ["Rohit Goswami <rgoswami@ieee.org>", "Amrita Goswami"]
description = "Julia front for the d-SEAMS molecular trajectory analysis engine: CHILL+ and CHILL ice/clathrate classification, Franzblau primitive rings, hexagonal and double-diamond cages, ring-census signature cages, Steinhardt order parameters (ql, qlbar, q4, q6), neighbour graphs, shell symmetry, jump reorientation tau90, partial RDF, coordination numbers, hydrogen bonds, axial density, topological fingerprints, ion contact pairs, polar/apolar domains, prisms, and monolayers. Supports native LAMMPS trajectories and XYZ files, with optional chemfiles (PDB, GRO, DCD, CIF) and readcon-core (.con) readers when built into the engine."

