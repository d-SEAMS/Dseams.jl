# Builds libseams and libseams_lang from seams-core at SEAMS_CORE_REF and
# runs Pkg.test for Dseams and Seams against them, with the seams-core
# checkout data and the C++ census oracle turned on, then both manuals.
# A push to main or a vX.Y.Z tag also publishes the Dseams manual (with
# llms.txt) to gh-pages from the job on the current Julia release.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# contents: write lets deploydocs push the manual to gh-pages.
permissions:
  contents: write

env:
  # release/2.14.0 on HaoZeke/seams-core. Becomes the v2.14.0 tag on
  # d-SEAMS/seams-core: set SEAMS_CORE_REPO to d-SEAMS/seams-core and
  # SEAMS_CORE_REF to v2.14.0 once that tag exists.
  SEAMS_CORE_REPO: HaoZeke/seams-core
  SEAMS_CORE_REF: 628b0af94b4d3bf52426708a0d08436027c8e4fa

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The long-term-support release and the current release.
        julia: ["lts", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SEAMS_CORE_REPO }}
          ref: ${{ env.SEAMS_CORE_REF }}
          path: seams-core
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          manifest-path: seams-core/pixi.toml
          environments: default
          cache-key: pixi-seams-core-
      - name: Build seams-core
        working-directory: seams-core
        run: |
          pixi run meson setup bbdir -Dwith_tests=true -Dwith_cli=true
          pixi run ninja -C bbdir bindings/libseams_lang.so bindings/binding_oracle src/libseams.so
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia }}
      - name: Engine settings
        run: |
          core="$GITHUB_WORKSPACE/seams-core"
          {
            echo "SEAMS_LANG_LIB=$core/bbdir/bindings/libseams_lang.so"
            echo "SEAMS_LIB=$core/bbdir/src/libseams.so"
            echo "SEAMS_CPP_ORACLE=$core/bbdir/bindings/binding_oracle"
            echo "SEAMS_SOURCE_ROOT=$core"
            echo "DSEAMS_ROOT=$core"
          } >> "$GITHUB_ENV"
      - name: Test Dseams
        run: |
          julia --project=. dev/develop_jll.jl
          julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Test Seams
        run: julia --project=lib/Seams -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Manuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSEAMS_DEPLOY_DOCS: ${{ matrix.julia == '1' && github.repository == 'd-SEAMS/Dseams.jl' && github.event_name == 'push' }}
        run: |
          julia --project=docs docs/make.jl
          julia --project=lib/Seams/docs lib/Seams/docs/make.jl
