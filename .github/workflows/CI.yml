# Builds libseams and libseams_lang from seams-core at SEAMS_CORE_REF and
# runs Pkg.test for Dseams and Seams against them, with the seams-core
# checkout data and the C++ census oracle turned on, then both manuals.
# A push to main or a vX.Y.Z tag also publishes the Dseams manual (with
# llms.txt) to gh-pages from the job on the current Julia release. A tag
# that TagBot pushes with GITHUB_TOKEN starts no push run, so TagBot
# dispatches this workflow on the tag instead.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The current Julia job publishes the generated manual to gh-pages.
permissions:
  contents: write

env:
  # Annotated tag v2.14.0 on d-SEAMS/seams-core (tag object
  # a54eee70f37da364f7abcbb49842b90b41d6ed07), which points at
  # acc8bbc803f55bac39493c85300f87a8ce302829. Checkout the tag, not a branch.
  SEAMS_CORE_REPO: d-SEAMS/seams-core
  # [[[cog
  # import tomllib
  # v = globals().get("version") or tomllib.load(open("Project.toml", "rb"))["version"]
  # cog.outl(f'SEAMS_CORE_REF: v{v}')
  # ]]]
  SEAMS_CORE_REF: v2.14.0
  # [[[end]]]
  # both-libs tests at least v2.14.1 (current seams-core release with
  # chemfiles and readcon-core) and follows Project.toml at bumps >= 2.14.1.
  # [[[cog
  # import tomllib
  # v = globals().get("version") or tomllib.load(open("Project.toml", "rb"))["version"]
  # t = tuple(int(x) for x in v.split("-")[0].split("."))
  # ref = v if t >= (2, 14, 1) else "2.14.1"
  # cog.outl(f'SEAMS_CORE_READERS_REF: v{ref}')
  # ]]]
  SEAMS_CORE_READERS_REF: v2.14.1
  # [[[end]]]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The long-term-support release and the current release.
        julia: ["lts", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SEAMS_CORE_REPO }}
          ref: ${{ env.SEAMS_CORE_REF }}
          path: seams-core
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: seams-core/pixi.toml
          environments: default
          cache-key: pixi-seams-core-
      - name: Build seams-core
        working-directory: seams-core
        run: |
          pixi run meson setup bbdir -Dwith_tests=true -Dwith_cli=true
          pixi run ninja -C bbdir bindings/libseams_lang.so bindings/binding_oracle src/libseams.so
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia }}
      - name: Engine settings
        run: |
          core="$GITHUB_WORKSPACE/seams-core"
          {
            echo "SEAMS_LANG_LIB=$core/bbdir/bindings/libseams_lang.so"
            echo "SEAMS_LIB=$core/bbdir/src/libseams.so"
            echo "SEAMS_CPP_ORACLE=$core/bbdir/bindings/binding_oracle"
            echo "SEAMS_SOURCE_ROOT=$core"
            echo "DSEAMS_ROOT=$core"
          } >> "$GITHUB_ENV"
      - name: Test Dseams
        run: |
          julia --project=. dev/develop_jll.jl
          julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Test Seams
        run: julia --project=lib/Seams -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Manuals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          julia --project=docs docs/make.jl
          julia --project=lib/Seams/docs lib/Seams/docs/make.jl
      - name: Documentation SEO
        run: |
          base_url="https://julia.dseams.info/"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            base_url="${base_url}${GITHUB_REF_NAME}/"
          fi
          python3 docs/seo.py check docs/build --base-url "$base_url"
      # README and the built manual. The published root URL is mapped to
      # the build, so a page this commit adds resolves before it deploys.
      # GitHub answers some blob pages with 503 under concurrent requests;
      # 503 says the host is busy, not that the link is gone, so it is
      # accepted. A 404 still fails.
      - name: Link check
        if: matrix.julia == '1'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 4
            --accept 200,206,429,503
            --index-files index.html
            --root-dir ${{ github.workspace }}/docs/build
            --remap "https://julia.dseams.info file://${{ github.workspace }}/docs/build"
            --remap "https://github.com/d-SEAMS/Dseams.jl/blob/main file://${{ github.workspace }}"
            README.md docs/build
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an empty root deployment
        if: matrix.julia == '1'
        run: |
          rm -rf "$RUNNER_TEMP/docs-site"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 docs/deploy_site.py docs/build "$RUNNER_TEMP/docs-site" --version "$GITHUB_REF_NAME"
          else
            python3 docs/deploy_site.py docs/build "$RUNNER_TEMP/docs-site" --root
          fi
      - name: Check out the published site
        if: matrix.julia == '1' && github.repository == 'd-SEAMS/Dseams.jl' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: docs-site
      - name: Publish crawlable documentation
        if: matrix.julia == '1' && github.repository == 'd-SEAMS/Dseams.jl' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 docs/deploy_site.py docs/build docs-site --version "$GITHUB_REF_NAME"
          else
            python3 docs/deploy_site.py docs/build docs-site --root
          fi
          cd docs-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      # Every page of the manual as its published URL, for the live check.
      # A tag publishes /vX.Y.Z/, while main is served directly at /.
      - name: List the manual pages
        if: matrix.julia == '1'
        working-directory: docs/build
        env:
          SITE_ROOT: ${{ startsWith(github.ref, 'refs/tags/') && format('https://julia.dseams.info/{0}/', github.ref_name) || 'https://julia.dseams.info/' }}
        run: find . -name '*.html' | sed -e 's#^\./##' -e 's#index\.html$##' -e "s#^#$SITE_ROOT#" | sort > "$GITHUB_WORKSPACE/site-pages.txt"
      - if: matrix.julia == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-pages
          path: site-pages.txt

  # Build seams-core explicitly with both chemfiles and readcon-core enabled,
  # assert that the feature queries report both as true, and run the suites so
  # the .con, PDB, and GRO tests cannot silently skip.
  both-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SEAMS_CORE_REPO }}
          ref: ${{ env.SEAMS_CORE_READERS_REF }}
          path: seams-core
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          manifest-path: seams-core/pixi.toml
          environments: default
          cache-key: pixi-seams-core-
      - name: Build seams-core with chemfiles and readcon-core
        working-directory: seams-core
        run: |
          pixi run meson setup bbdir -Dwith_tests=true -Dwith_cli=true -Dwith_chemfiles=enabled -Dwith_readcon=enabled
          pixi run ninja -C bbdir bindings/libseams_lang.so bindings/binding_oracle src/libseams.so
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1"
      - name: Engine settings
        run: |
          core="$GITHUB_WORKSPACE/seams-core"
          {
            echo "SEAMS_LANG_LIB=$core/bbdir/bindings/libseams_lang.so"
            echo "SEAMS_LIB=$core/bbdir/src/libseams.so"
            echo "SEAMS_CPP_ORACLE=$core/bbdir/bindings/binding_oracle"
            echo "SEAMS_SOURCE_ROOT=$core"
            echo "DSEAMS_ROOT=$core"
          } >> "$GITHUB_ENV"
      - name: Verify reader feature queries
        run: |
          julia --project=. dev/develop_jll.jl
          julia --project=. -e 'using Dseams; @assert has_chemfiles(); @assert has_readcon(); @assert features() == (chemfiles = true, readcon = true)'
      - name: Test Dseams
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Test Seams
        run: julia --project=lib/Seams -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  # The published manual, page by page, once GitHub Pages has built the
  # gh-pages commit that the current Julia job pushed. Each page is fetched from
  # julia.dseams.info and its links are resolved against that page, so a
  # page or a link missing from the live site fails the workflow. Source
  # links into this repository were checked against the checkout in the
  # test job and are not fetched from GitHub again.
  live:
    needs: test
    if: github.repository == 'd-SEAMS/Dseams.jl' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .lycheeignore
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-pages
      - name: Wait for the Pages build of gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" --jq .commit.sha)
          for _ in $(seq 1 60); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '"\(.commit) \(.status)"')
            echo "$build"
            [ "$build" = "$head built" ] && exit 0
            sleep 10
          done
          echo "Pages did not build $head" >&2
          exit 1
      - id: pages
        run: echo "urls=$(tr '\n' ' ' < site-pages.txt)" >> "$GITHUB_OUTPUT"
      - name: Live link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --max-concurrency 4
            --accept 200,202,206,429,503
            --exclude "^https://github\.com/d-SEAMS/Dseams.jl/blob/main/"
            ${{ steps.pages.outputs.urls }}
          token: ${{ secrets.GITHUB_TOKEN }}
