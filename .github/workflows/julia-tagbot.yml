# Tags a Dseams release (vX.Y.Z) after General merges it. Dseams is the
# repository root, so the tags are plain versions.
name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: write
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.repository == 'd-SEAMS/Dseams.jl' && (github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot')
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@a761b867f05e7e410011ab16b244f2fffec16c85 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # A tag pushed with GITHUB_TOKEN starts no push run, but GITHUB_TOKEN
      # may dispatch one. Every vX.Y.Z tag without a folder on gh-pages gets
      # a CI run on that tag, which publishes that version of the manual.
      - name: Publish the manual for new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')
          # gh-pages does not exist before the first deploy.
          published=""
          if gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" --silent 2>/dev/null; then
            published=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/gh-pages" --jq '.tree[].path')
          fi
          for tag in $tags; do
            if printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' &&
              ! printf '%s\n' "$published" | grep -qxF "$tag"; then
              echo "dispatching CI on ${tag}"
              gh workflow run CI.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
            fi
          done
