# Tags a Dseams release (vX.Y.Z) after General merges it. Dseams is the
# repository root, so the tags are plain versions.
name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.repository == 'd-SEAMS/Dseams.jl' && (github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot')
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@87cc4cc2b4639f6c743f5772f376a32914060732 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A tag pushed with GITHUB_TOKEN starts no workflow. With a deploy
          # key in DOCUMENTER_KEY the tag runs CI, which publishes that
          # version of the manual.
          ssh: ${{ secrets.DOCUMENTER_KEY }}
