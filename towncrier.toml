[tool.towncrier]
name = "Dseams.jl"
# [[[cog
# import tomllib
# v = globals().get("version") or tomllib.load(open("Project.toml", "rb"))["version"]
# cog.outl(f'version = "{v}"')
# ]]]
version = "2.14.2"
# [[[end]]]
directory = "docs/newsfragments"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}] - {project_date}\n\n[{version}]: https://github.com/d-SEAMS/Dseams.jl/tree/v{version}"
issue_format = "[#{issue}](https://github.com/d-SEAMS/Dseams.jl/issues/{issue})"
orphan_prefix = "+"
ignore = [".gitkeep"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "dev"
name = "Developer"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
