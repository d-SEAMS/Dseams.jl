description = "Example Julia wrapper over the libseams C API (include/seams.h): CHILL+ and CHILL ice classification, q4/q6 and Steinhardt order parameters, primitive six-rings and ring vertices, hexagonal/double-diamond and signature cages, k-NN neighbours, partial RDF, coordination numbers, hydrogen bonds, axial density, topological fingerprints, contact pairs, domains, prisms, monolayers, site tables, and OpenMP thread controls. Supports LAMMPS and XYZ files, plus chemfiles and readcon-core formats when built into libseams."

